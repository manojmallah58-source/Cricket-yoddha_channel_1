<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cricket Yoddha - Live Sports Streaming</title>
    <!-- Favicon -->
    <link rel="icon" href="assets/favicon.png" type="image/png">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/animation.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- App Container (Mobile Native App Style) -->
    <div class="app-container">
        
        <!-- Sticky Header -->
        <header class="app-header">
            <div class="header-left">
                <a href="index.html" class="logo-box">
                    <img src="assets/logo.png" alt="Cricket Yoddha Logo" class="logo-img" onerror="this.src='assets/default-channel.png'">
                    <span class="logo-text">Cricket <span class="highlight">Yoddha</span></span>
                </a>
            </div>
            <div class="header-right">
                <a href="search.html" class="icon-btn" aria-label="Search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </a>
                <button class="icon-btn notification-btn" id="notificationBtn" aria-label="Notifications">
                    <i class="fa-regular fa-bell"></i>
                    <span class="badge-dot"></span>
                </button>
            </div>
        </header>

        <!-- Main Scrollable Content -->
        <main class="app-content">
            
            <!-- Featured Banner Slider -->
            <section class="banner-section">
                <div class="banner-slider" id="bannerSlider">
                    <!-- Dynamic Banners Loaded via JS -->
                    <div class="banner-slide active" style="background-image: url('assets/default-banner.jpg');">
                        <div class="banner-overlay">
                            <span class="live-tag"><i class="fa-solid fa-circle"></i> LIVE NOW</span>
                            <h2>IND vs AUS 3rd ODI</h2>
                            <p>Watch live uninterrupted streaming in HD quality.</p>
                            <a href="live.html" class="btn-primary ripple"><i class="fa-solid fa-play"></i> Watch Now</a>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Live Matches Section -->
            <section class="section-block">
                <div class="section-header">
                    <h3><i class="fa-solid fa-tower-broadcast text-danger"></i> Live Matches</h3>
                    <a href="live.html" class="see-all">See All <i class="fa-solid fa-angle-right"></i></a>
                </div>
                <div class="horizontal-scroll" id="liveMatchesContainer">
                    <!-- Skeleton Loader -->
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                </div>
            </section>

            <!-- Popular Sports Channels -->
            <section class="section-block">
                <div class="section-header">
                    <h3><i class="fa-solid fa-tv text-primary"></i> Popular Sports Channels</h3>
                    <a href="channels.html" class="see-all">See All <i class="fa-solid fa-angle-right"></i></a>
                </div>
                <div class="grid-channels" id="channelsContainer">
                    <!-- Dynamically Loaded from JSON -->
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                </div>
            </section>

            <!-- Trending Matches / Highlights -->
            <section class="section-block">
                <div class="section-header">
                    <h3><i class="fa-solid fa-fire text-warning"></i> Trending Streams</h3>
                </div>
                <div class="vertical-list" id="trendingContainer">
                    <!-- Dynamic Data -->
                </div>
            </section>

        </main>

        <!-- Bottom Navigation Bar (Android Native Style) -->
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item active">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
            <a href="live.html" class="nav-item">
                <i class="fa-solid fa-bolt"></i>
                <span>Live</span>
            </a>
            <a href="channels.html" class="nav-item">
                <i class="fa-solid fa-tv"></i>
                <span>Channels</span>
            </a>
            <a href="search.html" class="nav-item">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>Search</span>
            </a>
            <a href="settings.html" class="nav-item">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>
        </nav>

    </div>

    <!-- JavaScript Imports -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
