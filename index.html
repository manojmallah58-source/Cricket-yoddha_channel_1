<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket Yoddha</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #e8000d;
      --red-dark: #c4000a;
      --bg: #0a0a0c;
      --card: #121215;
      --border: rgba(255,255,255,0.08);
      --text: #f8f8f8;
      --muted: #aaaaaa;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Loading Screen */
    #loading-screen {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
      z-index: 9999;
      transition: opacity 0.6s ease;
    }
    .load-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(42px, 9vw, 58px);
      letter-spacing: 8px;
      font-weight: 700;
    }
    .load-logo span { color: var(--red); }
    .load-bar-wrap {
      width: 280px;
      max-width: 80vw;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 50px;
      overflow: hidden;
    }
    .load-bar {
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, var(--red), #ff4d57);
      border-radius: 50px;
      animation: loading 1.4s infinite ease-in-out;
      box-shadow: 0 0 15px var(--red);
    }
    @keyframes loading {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(350%); }
    }

    /* Main Container */
    #player-container {
      display: none;
      flex-direction: column;
      min-height: 100vh;
    }

    .video-wrap {
      position: relative;
      background: #000;
      aspect-ratio: 16 / 9;
      overflow: hidden;
    }

    #main-iframe {
      width: 100%;
      height: 100%;
      border: none;
      position: absolute;
      top: 0; left: 0;
    }

    /* Top Bar */
    .topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 14px 20px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 6px;
    }
    .brand span { color: var(--red); }

    .live-pill {
      background: var(--red);
      color: white;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 1px;
      box-shadow: 0 0 15px rgba(232, 0, 13, 0.5);
    }
    .live-dot {
      width: 7px;
      height: 7px;
      background: white;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* Bottom Panel */
    .bottom-panel {
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 24px 20px;
      flex: 1;
    }

    .join-banner {
      background: linear-gradient(135deg, #1a1a1f, #121215);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .join-text h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      line-height: 1;
      background: linear-gradient(90deg, #fff, var(--red));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .join-text p {
      color: var(--muted);
      font-size: 14px;
      margin-top: 6px;
    }

    .tg-join-btn {
      background: linear-gradient(135deg, #0088cc, #0066aa);
      color: white;
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 8px 25px rgba(0, 136, 204, 0.3);
    }
    .tg-join-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0, 136, 204, 0.4);
    }

    /* Popup */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      backdrop-filter: blur(12px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .overlay.active { display: flex; }

    .popup {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 80px rgba(0,0,0,0.7);
    }

    .popup-icon {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, #0088cc, #0066aa);
      border-radius: 18px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .popup h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      margin-bottom: 12px;
    }

    .btn-join {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #0088cc, #0066aa);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.3s;
    }
    .btn-join:hover {
      transform: scale(1.03);
    }

    /* Error Screen */
    #error-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--bg);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      text-align: center;
      padding: 20px;
      z-index: 9998;
    }
  </style>
</head>
<body>

  <!-- Loading -->
  <div id="loading-screen">
    <div class="load-logo">CRICKET <span>YODDHA</span></div>
    <div class="load-bar-wrap"><div class="load-bar"></div></div>
  </div>

  <!-- Error -->
  <div id="error-screen">
    <h2 style="color:var(--red); font-family:'Bebas Neue',sans-serif; font-size:36px;">Stream Offline</h2>
    <p style="color:var(--muted); max-width:320px;">This stream is currently unavailable. Please try again later.</p>
    <button onclick="location.reload()" style="margin-top:20px; padding:12px 32px; background:var(--red); color:white; border:none; border-radius:12px; font-weight:600; cursor:pointer;">Retry</button>
  </div>

  <!-- Player -->
  <div id="player-container">
    <div class="video-wrap">
      <div class="topbar">
        <div class="brand">CRICKET <span>YODDHA</span></div>
        <div class="live-pill">
          <div class="live-dot"></div>
          LIVE
        </div>
      </div>
      <iframe id="main-iframe" allowfullscreen allow="encrypted-media; fullscreen; autoplay"></iframe>
    </div>

    <div class="bottom-panel">
      <div class="join-banner">
        <div class="join-text">
          <h1>CRICKET YODDHA</h1>
          <p>Free HD Streams • Live Scores • Instant Updates</p>
        </div>
        <a href="#" class="tg-join-btn" onclick="showPopup(); return false;">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12L8.32 14.617l-2.96-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.828.942z"/>
          </svg>
          Join Telegram
        </a>
      </div>
    </div>
  </div>

  <!-- Popup -->
  <div class="overlay" id="forcePop">
    <div class="popup">
      <div class="popup-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="white" viewBox="0 0 24 24">
          <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12L8.32 14.617l-2.96-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.828.942z"/>
        </svg>
      </div>
      <h2>CRICKET YODDHA</h2>
      <p style="color:#ccc; line-height:1.6;">Join our official Telegram channel for seamless access to all live matches.</p>
      <button class="btn-join" onclick="goTelegram()">Join Telegram Now</button>
    </div>
  </div>

  <script>
    const CONFIG = {
      timeKey: "yoddha_time_v2",
      expiry: 86400000 // 24 hours
    };

    function loadStream() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      
      if (!id) {
        showError("No stream ID provided");
        return;
      }

      const JSON_URL = "https://allrounder2-0.pages.dev/id.json";
      
      fetch(JSON_URL + "?t=" + Date.now())
        .then(res => res.json())
        .then(data => {
          const stream = data.iframes?.find(x => x.id === id);
          if (!stream || !stream.iframeSrc) {
            showError("Stream not found");
            return;
          }

          document.title = (stream.name || "Live Match") + " — Cricket Yoddha";
          document.getElementById("main-iframe").src = stream.iframeSrc;
          revealPlayer();
        })
        .catch(() => showError("Failed to load stream"));
    }

    function revealPlayer() {
      document.getElementById("loading-screen").style.opacity = "0";
      setTimeout(() => {
        document.getElementById("loading-screen").style.display = "none";
        document.getElementById("player-container").style.display = "flex";
      }, 600);
    }

    function showError(msg) {
      document.getElementById("loading-screen").style.display = "none";
      document.getElementById("error-screen").style.display = "flex";
    }

    function showPopup() {
      document.getElementById('forcePop').classList.add('active');
    }

    function goTelegram() {
      localStorage.setItem(CONFIG.timeKey, Date.now());
      document.getElementById('forcePop').classList.remove('active');
      window.open("https://t.me/+p17HazejGX1jNmE1", "_blank");
    }

    // Initialize
    window.onload = () => {
      const lastJoin = localStorage.getItem(CONFIG.timeKey);
      const now = Date.now();

      if (!lastJoin || (now - lastJoin > CONFIG.expiry)) {
        setTimeout(() => {
          showPopup();
        }, 8000); // Show popup after 8 seconds
      }
      loadStream();
    };
  </script>
</body>
</html>
