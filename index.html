<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="utf-8"> 
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"> 
<meta name="referrer" content="no-referrer"> 
<meta name="mobile-web-app-capable" content="yes"> 
<meta name="apple-mobile-web-app-capable" content="yes"> 
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> 
<style> 
*{margin:0;padding:0;box-sizing:border-box} 
html,body{width:100%;height:100%;background:#0a0a0a;overflow:hidden; 
font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; 
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none} 

#overlay{position:fixed;inset:0;background:#0a0a0a;z-index:9999; 
display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px} 
#overlay svg{animation:spin 1s linear infinite} 
@keyframes spin{to{transform:rotate(360deg)}} 
#overlay p{color:#555;font-size:13px;letter-spacing:.4px; 
text-align:center;padding:0 24px;font-weight:500} 

#channel-list{position:fixed;inset:0;background:#0a0a0a;z-index:9998; 
display:none;flex-direction:column;overflow-y:auto; 
padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))} 
#channel-list h1{color:#fff;font-size:16px;font-weight:600;letter-spacing:.5px; 
margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid #141414;text-align:center} 
#ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px} 
.ch-card{background:#111;border:1px solid #1a1a1a;border-radius:10px;padding:16px 12px; 
cursor:pointer;text-decoration:none;display:flex;align-items:center; 
justify-content:center;text-align:center; 
transition:background .2s,border-color .2s,transform .15s; 
-webkit-tap-highlight-color:transparent} 
.ch-card:hover{background:#161616;border-color:#252525} 
.ch-card:active{transform:scale(.96);background:#1c1c1c} 
.ch-card:focus-visible{outline:2px solid #38bdf8;outline-offset:2px} 
.ch-card span{color:#e0e0e0;font-size:13px;font-weight:500;line-height:1.4} 

#player-container{position:fixed;inset:0;width:100%;height:100%;background:#000;display:none;z-index:9990;} 
#player-iframe{width:100%;height:100%;border:none;background:#000;} 

#status{position:fixed;top:max(12px,env(safe-area-inset-top)); 
right:max(12px,env(safe-area-inset-right));z-index:9997; 
padding:5px 13px;background:rgba(8,8,8,.9); 
border:1px solid rgba(255,255,255,.05); 
font-size:11px;font-weight:500;letter-spacing:.02em;border-radius:20px; 
pointer-events:none;opacity:0;transition:opacity .3s; 
max-width:260px;text-align:right; 
backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)} 
#status.show{opacity:1} 
#status.ok{color:#38bdf8} 
#status.warn{color:#fb923c} 
#status.err{color:#f87171} 
</style> 
</head> 
<body> 

<div id="overlay"> 
<svg width="36" height="36" viewBox="0 0 40 40" fill="none"> 
<circle cx="20" cy="20" r="16" stroke="#161616" stroke-width="4"/> 
<path d="M20 4a16 16 0 0 1 16 16" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/> 
</svg> 
<p id="loadMsg">Loading…</p> 
</div> 

<div id="status"></div> 

<div id="channel-list"> 
<h1>CnpTVOfficial</h1> 
<div id="ch-grid"></div> 
</div> 

<div id="player-container">
<iframe id="player-iframe" allowfullscreen allow="encrypted-media; autoplay; fullscreen; picture-in-picture"></iframe>
</div> 

<script> 
(function(){ 
"use strict"; 

var API = "https://upaidworker.streamxlive.workers.dev/"; 

var $overlay = document.getElementById("overlay"); 
var $loadMsg = document.getElementById("loadMsg"); 
var $status = document.getElementById("status"); 
var $list = document.getElementById("channel-list"); 
var $grid = document.getElementById("ch-grid"); 
var $playerContainer = document.getElementById("player-container"); 
var $iframe = document.getElementById("player-iframe"); 
var _stTmr = null; 

function toast(msg,type,dur){ 
$status.textContent=msg; 
$status.className="show "+(type||"ok"); 
if(_stTmr) clearTimeout(_stTmr); 
if(dur!==0){ 
_stTmr=setTimeout(function(){ 
$status.className=$status.className.replace("show","").trim(); 
_stTmr=null; 
},dur||4000); 
} 
} 

function setMsg(m) { $loadMsg&&($loadMsg.textContent=m); } 
function hideOverlay() { $overlay&&($overlay.style.display="none"); } 
function getChId() { return new URLSearchParams(location.search).get("id")||""; } 

async function loadData(){ 
var r = await fetch(API, { cache: "no-store", headers: { Accept: "application/json" } }); 
if(!r.ok) throw new Error("HTTP "+r.status); 
var d = await r.json(); 
var list = Array.isArray(d) ? d : (d.iframes || d.channels);
if(!list || !Array.isArray(list) || !list.length) throw new Error("empty"); 
return { channels: list }; 
} 

function renderList(channels){ 
hideOverlay(); 
var f=document.createDocumentFragment(); 
channels.forEach(function(ch){ 
var a=document.createElement("a"); 
a.className="ch-card"; 
a.href="?id="+encodeURIComponent(ch.id); 
a.innerHTML="<span>"+ch.name+"</span>"; 
f.appendChild(a); 
}); 
$grid.appendChild(f); 
$list.style.display="flex"; 
} 

function errMsg(msg){ setMsg(msg); $overlay.style.display="flex"; toast(msg,"err",0); } 

async function main(){ 
var id = getChId(), data; 
try { 
setMsg("Fetching channels…"); 
data = await loadData(); 
} catch(e) { 
errMsg("Connection error."); 
return; 
} 

if(!id){ 
renderList(data.channels); 
return; 
} 

var ch = data.channels.find(function(c){ return String(c.id) === String(id); }); 
if(!ch){ 
errMsg("Channel not found."); 
return; 
} 

document.title = ch.name; 
hideOverlay(); 

var iframeSrc = ch.iframeSrc || ch.url;
if(!iframeSrc) {
errMsg("Iframe link missing.");
return;
}

$playerContainer.style.display = "block";
$iframe.src = iframeSrc;
toast("● Live", "ok", 3000);
} 

document.addEventListener("DOMContentLoaded", main); 
})(); 
</script> 
</body> 
</html>
