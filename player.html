<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stream Player - Cricket Yoddha</title>
    <link rel="icon" href="assets/favicon.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/animation.css">
    <link rel="stylesheet" href="css/player.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="player-body">

    <!-- Video Player Screen Wrapper -->
    <div class="player-wrapper">
        
        <!-- Top Control Bar -->
        <div class="player-top-bar" id="playerTopBar">
            <button class="player-ctrl-btn" id="backBtn" aria-label="Go Back">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="stream-meta-info">
                <span class="live-indicator"><i class="fa-solid fa-circle"></i> LIVE</span>
                <h4 id="streamTitle">Loading Stream...</h4>
            </div>
            <div class="player-top-actions">
                <button class="player-ctrl-btn" id="reloadStreamBtn" title="Reload Stream">
                    <i class="fa-solid fa-rotate"></i>
                </button>
                <button class="player-ctrl-btn" id="shareBtn" title="Share Stream">
                    <i class="fa-solid fa-share-nodes"></i>
                </button>
            </div>
        </div>

        <!-- Main Video Iframe Container -->
        <div class="video-container" id="videoContainer">
            <iframe id="streamIframe" src="" allowfullscreen allow="encrypted-media; autoplay; picture-in-picture" frameborder="0"></iframe>
            
            <!-- Loading Overlay -->
            <div class="player-loader" id="playerLoader">
                <img src="assets/loading.gif" alt="Loading Stream..." class="loader-gif">
                <p>Connecting to secure server...</p>
            </div>

            <!-- Error / Retry Overlay -->
            <div class="player-error-screen hidden" id="playerErrorScreen">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <h3>Stream Failed to Load</h3>
                <p>The stream link might be offline or blocked.</p>
                <button class="btn-primary ripple" id="retryStreamBtn">
                    <i class="fa-solid fa-rotate-right"></i> Retry Stream
                </button>
            </div>
        </div>

        <!-- Bottom Controls / Info Bar -->
        <div class="player-bottom-bar" id="playerBottomBar">
            <div class="channel-details-row">
                <img src="assets/default-channel.png" alt="Logo" id="playerChannelLogo" class="player-ch-logo">
                <div>
                    <h5 id="playerChannelName">Cricket Yoddha HD</h5>
                    <p id="playerSubText">Secure High-Speed Live Stream</p>
                </div>
            </div>
            <div class="player-action-buttons">
                <button class="action-chip" id="refreshBtn"><i class="fa-solid fa-rotate"></i> Refresh</button>
                <button class="action-chip" id="fullscreenBtn"><i class="fa-solid fa-expand"></i> Fullscreen</button>
            </div>
        </div>

    </div>

    <script src="js/api.js"></script>
    <script src="js/player.js"></script>
</body>
</html>
