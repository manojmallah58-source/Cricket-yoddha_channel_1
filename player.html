<!DOCTYPE html> 
<html lang="en"> 
<head> 
<meta charset="utf-8"> 
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"> 
<title>Stream Player - Cricket Yoddha</title>
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css"> 
<style> 
*{margin:0;padding:0;box-sizing:border-box} 
html,body{width:100%;height:100%;background:#0f172a;overflow:hidden; 
font-family:system-ui,-apple-system,sans-serif; 
-webkit-user-select:none;user-select:none} 

#overlay{position:fixed;inset:0;background:#0f172a;z-index:9999; 
display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px} 
#overlay svg{animation:spin 1s linear infinite} 
@keyframes spin{to{transform:rotate(360deg)}} 
#overlay p{color:#94a3b8;font-size:13px;letter-spacing:.4px; 
text-align:center;padding:0 24px;font-weight:500} 

#channel-list{position:fixed;inset:0;background:#0f172a;z-index:9998; 
display:none;flex-direction:column;overflow-y:auto; 
padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))} 
#channel-list h1{color:#fff;font-size:18px;font-weight:700;letter-spacing:.5px; 
margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.1);text-align:center} 
#ch-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:480px;margin:0 auto;width:100%} 

.ch-card{background:rgba(30,41,59,0.7);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:14px 10px; 
cursor:pointer;text-decoration:none;display:flex;flex-direction:column;align-items:center; 
justify-content:center;text-align:center;gap:8px; 
transition:transform .2s,background .2s} 
.ch-card:hover{background:rgba(30,41,59,0.9)} 
.ch-card:active{transform:scale(0.96)} 

.ch-logo-wrap{width:50px;height:50px;background:#1e293b;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.1);overflow:hidden}
.ch-logo-wrap img{width:80%;height:80%;object-fit:contain}
.ch-card span{color:#f8fafc;font-size:13px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%} 

#pc{position:fixed;inset:0;background:#000;display:flex; 
align-items:center;justify-content:center;touch-action:manipulation} 
video{width:100%;height:100%;object-fit:contain;background:#000} 
video.mode-fill{object-fit:fill} 
video.mode-cover{object-fit:cover} 

#status{position:fixed;top:max(12px,env(safe-area-inset-top)); 
right:max(12px,env(safe-area-inset-right));z-index:9997; 
padding:6px 14px;background:rgba(15,23,42,0.9); 
border:1px solid rgba(255,255,255,0.1); 
font-size:11px;font-weight:600;border-radius:20px; 
pointer-events:none;opacity:0;transition:opacity .3s; 
color:#38bdf8;backdrop-filter:blur(4px)} 
#status.show{opacity:1} 

.sp-btn{background:transparent!important;border:none!important;cursor:pointer!important;padding:0 8px!important;opacity:.8;display:flex;align-items:center;justify-content:center;gap:5px;height:100%;min-width:36px;color:#fff!important} 
.sp-btn:hover{opacity:1} 
.fit-ratio{font-size:11px;font-weight:600} 
.shaka-controls-container button{color:#fff!important} 
.shaka-video-container{background-color:#000!important} 
</style> 
</head> 
<body> 

<div id="overlay"> 
<svg width="36" height="36" viewBox="0 0 40 40" fill="none"> 
<circle cx="20" cy="20" r="16" stroke="#1e293b" stroke-width="4"/> 
<path d="M20 4a16 16 0 0 1 16 16" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/> 
</svg> 
<p id="loadMsg">Loading Cricket Yoddha Streams…</p> 
</div> 

<div id="status"></div> 

<div id="channel-list"> 
<h1>Select Sports Channel</h1> 
<div id="ch-grid"></div> 
</div> 

<div id="pc"> 
<video id="v" playsinline webkit-playsinline preload="none"></video> 
</div> 

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script> 
<script> 
(function(){ 
"use strict"; 

var API = "https://raw.githubusercontent.com/manojmallah58-source/Cricket-yoddha-json/main/links.json"; 

var $overlay = document.getElementById("overlay"); 
var $loadMsg = document.getElementById("loadMsg"); 
var $status = document.getElementById("status"); 
var $list = document.getElementById("channel-list"); 
var $grid = document.getElementById("ch-grid"); 
var $pc = document.getElementById("pc"); 
var $vid = document.getElementById("v"); 

function toast(msg,dur){ 
$status.textContent=msg; 
$status.className="show"; 
setTimeout(function(){ $status.className=""; }, dur||3000); 
} 

function setMsg(m) { if($loadMsg) $loadMsg.textContent=m; } 
function hideOverlay() { if($overlay) $overlay.style.display="none"; } 
function getChId() { return new URLSearchParams(location.search).get("id")||""; } 
function rawCookie(c) { return c&&c.startsWith("__hdnea__=")?c.slice(10):(c||""); } 
function withCookie(u,r){ 
if(!u||!r) return u; 
if(u.indexOf("__hdnea__")!==-1) return u; 
return u+(u.indexOf("?")!==-1?"&":"?")+"__hdnea__="+r; 
} 

async function loadData(){ 
var r=await fetch(API,{cache:"no-store"}); 
if(!r.ok) throw new Error("HTTP "+r.status); 
var d=await r.json(); 
var list = Array.isArray(d) ? d : (d.channels || d.links || []);
return { channels: list }; 
} 

function renderList(channels){ 
hideOverlay(); 
$grid.innerHTML = "";
var f=document.createDocumentFragment(); 
channels.forEach(function(ch){ 
var a=document.createElement("a"); 
a.className="ch-card"; 
a.href="player.html?id=" + encodeURIComponent(ch.id || ch.name); 
var logo = ch.logo || 'assets/default-channel.png';
a.innerHTML = '<div class="ch-logo-wrap"><img src="'+logo+'" onerror="this.src=\'assets/default-channel.png\'"></div><span>'+ch.name+'</span>'; 
f.appendChild(a); 
}); 
$grid.appendChild(f); 
$list.style.display="flex"; 
} 

async function startPlayer(ch){ 
$pc.style.display="flex"; 
shaka.polyfill.installAll(); 
if(!shaka.Player.isBrowserSupported()){ alert("Browser not supported"); return; } 

var player=new shaka.Player(); 
await player.attach($vid); 

new shaka.ui.Overlay(player,$pc,$vid).configure({ 
controlPanelElements:["play_pause","mute","volume","time_and_duration","spacer","quality","fullscreen"] 
}); 

var cookie=ch.cookie || "", raw=rawCookie(cookie); 
var keyId=ch.keyId || ch.key_id, key=ch.key, url=ch.url || ch.stream_url || ch.iframeSrc; 

player.configure({ 
drm:{ clearKeys:{ [keyId]:key } }, 
streaming:{ bufferingGoal:10, rebufferingGoal:2 } 
}); 

var T=shaka.net.NetworkingEngine.RequestType; 
player.getNetworkingEngine().registerRequestFilter(function(type,req){ 
req.headers["Referer"] ="https://www.jiotv.com/"; 
req.headers["User-Agent"] ="Mozilla/5.0 (Linux; Android 11) AppleWebKit/537.36"; 
req.headers["Cookie"] =cookie; 
if(type===T.MANIFEST||type===T.SEGMENT) 
req.uris=req.uris.map(function(u){ return withCookie(u,raw); }); 
}); 

try{ 
setMsg("Loading stream..."); 
toast("Connecting..."); 
await player.load(url); 
hideOverlay(); 
toast("● Live Stream Playing"); 
$vid.play().catch(function(){}); 
} catch(e){ 
hideOverlay(); 
toast("Stream failed to load"); 
} 
} 

async function main(){ 
var id=getChId(), data; 
try{ 
setMsg("Fetching channels..."); 
data=await loadData(); 
} catch(e){ 
setMsg("Connection error!"); 
return; 
} 

if(!id){ 
renderList(data.channels); 
return; 
} 

var ch=data.channels.find(function(c){ return String(c.id)===String(id) || String(c.name)===String(id); }); 
if(!ch){ 
alert("Channel not found!"); 
location.href="player.html"; 
return; 
} 
document.title=ch.name + " - Cricket Yoddha"; 
await startPlayer(ch); 
} 

document.addEventListener("DOMContentLoaded",main); 
})(); 
</script> 
</body> 
</html>
